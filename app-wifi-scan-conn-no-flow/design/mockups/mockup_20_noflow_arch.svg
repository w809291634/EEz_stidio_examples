<svg viewBox="0 0 680 836" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <title>架构图 · no-flow 变体（EEZ 静态外壳 + native 全动态，无 Flow 运行时）</title>
  <desc>五层：EEZ 工程(flowSupport=false) → 生成源码(无 eez-flow) → 执行模型对照 → native 层 → 账单</desc>
  <rect x="0" y="0" width="680" height="836" rx="14" fill="#0B0F1A" stroke="#26314A" stroke-width="1"/>
    <text x="28" y="38" fill="#F0F4FC" font-size="20" font-weight="500">no-flow 架构：代码在哪、边界在哪</text>
    <text x="28" y="64" fill="#8A99B3" font-size="12.5">flowSupport=false ⇒ EEZ 只出静态控件树；执行模型回到纯 LVGL，动态逻辑全在 native</text>
    <path d="M28 78 H652" fill="none" stroke="#26314A" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="88" width="632" height="130" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="108" fill="#5C6A85" font-size="9">①</text>
    <text x="58" y="108" fill="#F0F4FC" font-size="10.5" font-weight="500">EEZ 工程 .eez-project（唯一设计源）</text>
    <text x="644" y="108" fill="#5C6A85" font-size="8.5" text-anchor="end">flowSupport=false</text>
    <rect x="36" y="112" width="144" height="88" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <text x="46" y="130" fill="#F0F4FC" font-size="9.5" font-weight="500">页面 / 控件树</text>
    <text x="46" y="148" fill="#8A99B3" font-size="8.5">main 单屏 480×320</text>
    <text x="46" y="163" fill="#8A99B3" font-size="8.5">标题 + 状态行 + 刷新</text>
    <text x="46" y="178" fill="#8A99B3" font-size="8.5">list_box（空 lv_list）</text>
    <rect x="192" y="112" width="144" height="88" fill="#101A28" rx="8" stroke="#E06A6A" stroke-width="0.6"/>
    <text x="202" y="130" fill="#F0F4FC" font-size="9.5" font-weight="500">变量：无</text>
    <text x="202" y="148" fill="#8A99B3" font-size="8.5">gvs = []</text>
    <text x="202" y="163" fill="#8A99B3" font-size="8.5">structures = []</text>
    <text x="202" y="178" fill="#8A99B3" font-size="8.5">vars.h 是空枚举</text>
    <rect x="348" y="112" width="144" height="88" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <text x="358" y="130" fill="#F0F4FC" font-size="9.5" font-weight="500">动作：1 个 native</text>
    <text x="358" y="148" fill="#8A99B3" font-size="8.5">scan_start</text>
    <text x="358" y="163" fill="#8A99B3" font-size="8.5">implementationType</text>
    <text x="358" y="178" fill="#8A99B3" font-size="8.5">= native（非 flow）</text>
    <rect x="504" y="112" width="144" height="88" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="514" y="130" fill="#F0F4FC" font-size="9.5" font-weight="500">样式 / 字体</text>
    <text x="514" y="148" fill="#8A99B3" font-size="8.5">主题令牌内联</text>
    <text x="514" y="163" fill="#8A99B3" font-size="8.5">cn14 · GB2312</text>
    <text x="514" y="178" fill="#8A99B3" font-size="8.5">行样式由 native 复用</text>
    <text x="36" y="210" fill="#9DB8FF" font-size="8.5">★ 与母工程唯一差异：build_example.py 里 flowSupport / generateSourceCodeForEezFramework = False</text>
    <path d="M340 218 V230" fill="none" stroke="#9DB8FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M335.5 225 l4.5 7 4.5 -7" fill="none" stroke="#9DB8FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="354" y="230" fill="#9DB8FF" font-size="8.5">cli_build</text>
    <rect x="24" y="236" width="632" height="112" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="256" fill="#5C6A85" font-size="9">②</text>
    <text x="58" y="256" fill="#F0F4FC" font-size="10.5" font-weight="500">生成源码 src/ui/（12 个模板文件 · 勿手改）</text>
    <text x="644" y="256" fill="#5C6A85" font-size="8.5" text-anchor="end">无 eez-flow.cpp/h</text>
    <rect x="36" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="45" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">screens.c</text>
    <text x="45" y="301" fill="#8A99B3" font-size="8.2">控件树 + 样式</text>
    <text x="45" y="315" fill="#5C6A85" font-size="8.2">★ 直挂动作回调</text>
    <rect x="159.2" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="168.2" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">actions.h</text>
    <text x="168.2" y="301" fill="#8A99B3" font-size="8.2">extern void</text>
    <text x="168.2" y="315" fill="#5C6A85" font-size="8.2">action_scan_start</text>
    <rect x="282.4" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="291.4" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">vars.h</text>
    <text x="291.4" y="301" fill="#8A99B3" font-size="8.2">空枚举</text>
    <text x="291.4" y="315" fill="#5C6A85" font-size="8.2">（无 Flow 全局变量）</text>
    <rect x="405.6" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="414.6" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">ui.c</text>
    <text x="414.6" y="301" fill="#8A99B3" font-size="8.2">create_screens()</text>
    <text x="414.6" y="315" fill="#5C6A85" font-size="8.2">+ loadScreen()</text>
    <rect x="528.8" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="537.8" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">structs.h</text>
    <text x="537.8" y="301" fill="#8A99B3" font-size="8.2">空壳</text>
    <text x="537.8" y="315" fill="#5C6A85" font-size="8.2">（无 Value 容器）</text>
    <text x="36" y="342" fill="#5C6A85" font-size="8.5">★ 红线：src/ui/ 由 EEZ 覆盖生成；改动只发生在 native/ 与 build_example.py</text>
    <rect x="24" y="360" width="632" height="124" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="380" fill="#5C6A85" font-size="9">③</text>
    <text x="58" y="380" fill="#F0F4FC" font-size="10.5" font-weight="500">执行模型：Flow 版 ↔ 本变体</text>
    <text x="644" y="380" fill="#5C6A85" font-size="8.5" text-anchor="end">同一条结论两种真假</text>
    <rect x="36" y="392" width="299" height="74" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="46" y="410" fill="#F0F4FC" font-size="9.5" font-weight="500">Flow 版（母工程）</text>
    <text x="46" y="428" fill="#8A99B3" font-size="8.5">ui_init → eez_flow_init(assets[588])</text>
    <text x="46" y="443" fill="#8A99B3" font-size="8.5">ui_tick → eez_flow_tick + tick_screen</text>
    <text x="46" y="458" fill="#8A99B3" font-size="8.5">事件经 flowState 中转 · 二进制 501 符号</text>
    <rect x="345" y="392" width="299" height="74" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <text x="355" y="410" fill="#3DDC97" font-size="9.5" font-weight="500">本变体（no-flow）</text>
    <text x="355" y="428" fill="#8A99B3" font-size="8.5">ui_init → create_screens + loadScreen</text>
    <text x="355" y="443" fill="#8A99B3" font-size="8.5">ui_tick → tick_screen(currentScreen)</text>
    <text x="355" y="458" fill="#8A99B3" font-size="8.5">lv_obj_add_event_cb 直连 · 二进制 0 符号</text>
    <text x="36" y="476" fill="#9DB8FF" font-size="8.5">→ 摘掉的是运行时，不是功能：表达式绑定 / flow 组件 / SetVariable 才是 Flow 的收益</text>
    <rect x="24" y="496" width="632" height="152" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="516" fill="#5C6A85" font-size="9">④</text>
    <text x="58" y="516" fill="#F0F4FC" font-size="10.5" font-weight="500">native 层（app 平铺四组 + navigation/widgets/platform）</text>
    <text x="644" y="516" fill="#5C6A85" font-size="8.5" text-anchor="end">零 Flow 引用</text>
    <rect x="36" y="528" width="196" height="62" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="46" y="546" fill="#F0F4FC" font-size="9.5" font-weight="500">platform/wifi_platform.h</text>
    <text x="46" y="564" fill="#8A99B3" font-size="8.5">契约面：wifi_ap_t 7 字段</text>
    <text x="46" y="579" fill="#8A99B3" font-size="8.5">纯头文件，零实现</text>
    <rect x="242" y="528" width="196" height="62" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <text x="252" y="546" fill="#F0F4FC" font-size="9.5" font-weight="500">widgets/wifi_list/wifi_list.cpp</text>
    <text x="252" y="564" fill="#8A99B3" font-size="8.5">native 直读 wifi_ap_at</text>
    <text x="252" y="579" fill="#8A99B3" font-size="8.5">★ 唯一画列表处</text>
    <rect x="448" y="528" width="196" height="62" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="458" y="546" fill="#F0F4FC" font-size="9.5" font-weight="500">platform/pc/wifi_platform_pc.cpp</text>
    <text x="458" y="564" fill="#8A99B3" font-size="8.5">假数据 + RSSI 排序</text>
    <text x="458" y="579" fill="#8A99B3" font-size="8.5">io_win / io_esp 未落地</text>
    <rect x="36" y="598" width="608" height="26" fill="#16203A" rx="6" stroke="#26314A" stroke-width="0.5"/>
    <text x="48" y="615" fill="#8A99B3" font-size="8.8">另有 app/wifi_model·view·events·logic 四组平铺业务文件 · navigation/wifi_nav.cpp（模态显隐）</text>
    <text x="36" y="640" fill="#5C6A85" font-size="8.5">扫描态/文案/列表行都由 native 每拍比对后直写 LVGL 控件（objects.*）</text>
    <rect x="24" y="664" width="632" height="122" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="684" fill="#5C6A85" font-size="9">⑤</text>
    <text x="58" y="684" fill="#F0F4FC" font-size="10.5" font-weight="500">摘掉 Flow 的账单（实测 2026-10-21）</text>
    <text x="644" y="684" fill="#5C6A85" font-size="8.5" text-anchor="end">可复现</text>
    <rect x="36" y="694" width="196" height="74" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="46" y="712" fill="#9DB8FF" font-size="9.5" font-weight="500">生成码（不含字体）</text>
    <text x="46" y="732" fill="#8A99B3" font-size="8.5">548,573 B → 13,950 B</text>
    <text x="46" y="747" fill="#8A99B3" font-size="8.5">少 eez-flow.cpp 9,923 行</text>
    <text x="46" y="762" fill="#8A99B3" font-size="8.5">+ eez-flow.h 4,384 行</text>
    <rect x="242" y="694" width="196" height="74" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="252" y="712" fill="#3DDC97" font-size="9.5" font-weight="500">二进制符号</text>
    <text x="252" y="732" fill="#8A99B3" font-size="8.5">eez::flow：501 → 0</text>
    <text x="252" y="747" fill="#8A99B3" font-size="8.5">nm main.exe | grep -i eez</text>
    <text x="252" y="762" fill="#8A99B3" font-size="8.5">仅误命中 focus_freeze</text>
    <rect x="448" y="694" width="196" height="74" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="458" y="712" fill="#F0D48F" font-size="9.5" font-weight="500">门禁（反向判据）</text>
    <text x="458" y="732" fill="#8A99B3" font-size="8.5">eez-flow.* 出现 = FAIL</text>
    <text x="458" y="747" fill="#8A99B3" font-size="8.5">preflight.check_no_flow</text>
    <text x="458" y="762" fill="#8A99B3" font-size="8.5">动作断链同样 FAIL</text>
    <text x="28" y="802" fill="#5C6A85" font-size="8.5">实现量分布</text>
    <rect x="28" y="810" width="430" height="16" fill="#5B8CFF" rx="4"/>
    <rect x="458" y="810" width="194" height="16" fill="#E06A6A" rx="4"/>
    <text x="243" y="822" fill="#0B0F1A" font-size="8.8" font-weight="500" text-anchor="middle">EEZ 静态外壳（画界面）</text>
    <text x="555" y="822" fill="#0B0F1A" font-size="8.2" font-weight="500" text-anchor="middle">native 全部动态逻辑</text>
</svg>
