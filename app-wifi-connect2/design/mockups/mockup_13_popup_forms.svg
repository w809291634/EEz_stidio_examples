    <rect x="20" y="282" width="640" height="190" fill="#0D1420" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="304" fill="#5C6A85" font-size="10.5">同一个「连接 WiFi 页」，两种高度</text>
    <text x="300" y="304" fill="#3DDC97" font-size="9.5">半页 200</text>
    <text x="470" y="304" fill="#9DB8FF" font-size="9.5">整页 320</text>
    <text x="36" y="337" fill="#5C6A85" font-size="9.5">覆盖屏高</text>
    <text x="300" y="337" fill="#F0F4FC" font-size="9.5">62%（上半仍可见列表）</text>
    <text x="470" y="337" fill="#F0F4FC" font-size="9.5">100%（完全覆盖，返回还原）</text>
    <rect x="32" y="348" width="616" height="0.6" fill="#26314A"/>
    <text x="36" y="367" fill="#5C6A85" font-size="9.5">键盘</text>
    <text x="300" y="367" fill="#F0F4FC" font-size="9.5">全宽 464 · 2~3 行紧凑（键高 30）</text>
    <text x="470" y="367" fill="#F0F4FC" font-size="9.5">全宽 464 · 4 行（键高 36）</text>
    <rect x="32" y="378" width="616" height="0.6" fill="#26314A"/>
    <text x="36" y="397" fill="#5C6A85" font-size="9.5">能放的内容</text>
    <text x="300" y="397" fill="#F0F4FC" font-size="9.5">密码框 + 连接（最多再加一行提示）</text>
    <text x="470" y="397" fill="#F0F4FC" font-size="9.5">密码 + 记住密码 + 忘记 + 错误提示</text>
    <rect x="32" y="408" width="616" height="0.6" fill="#26314A"/>
    <text x="36" y="427" fill="#5C6A85" font-size="9.5">交互负担</text>
    <text x="300" y="427" fill="#8A99B3" font-size="9.5">需管把手、遮罩、下滑关闭、焦点避让</text>
    <text x="470" y="427" fill="#8A99B3" font-size="9.5">切页即可：无遮罩、无 z-order</text>
    <rect x="32" y="438" width="616" height="0.6" fill="#26314A"/>
    <text x="36" y="457" fill="#5C6A85" font-size="9.5">适合</text>
    <text x="300" y="457" fill="#8A99B3" font-size="9.5">宿主页要保留上下文 / 快捷重连</text>
    <text x="470" y="457" fill="#8A99B3" font-size="9.5">主流程：输密码、忘记、重试</text>
    <text x="28" y="496" fill="#9DB8FF" font-size="9.5">建议：主流程用整页（简单、键盘最大化）；若 WiFi 只是设置页里的一个小卡片，可给「半页」快捷形态</text>
</svg>
