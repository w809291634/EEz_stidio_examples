<svg viewBox="0 0 680 884" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <title>架构图 · v4 路线（EEZ 画界面+标量状态，列表数据 native 直读 io）</title>
  <desc>五层：EEZ 工程 → 生成源码 → Flow 运行时 → native 薄层 → 硬件；含占比与三条目标保障</desc>
  <rect x="0" y="0" width="680" height="884" rx="14" fill="#0B0F1A" stroke="#26314A" stroke-width="1"/>
    <text x="28" y="38" fill="#F0F4FC" font-size="20" font-weight="500">v4 架构：代码在哪、边界在哪</text>
    <text x="28" y="64" fill="#8A99B3" font-size="12.5">界面与标量状态在 EEZ 工程内（≈85%）；列表全量数据由 native 直读 io 接口（≈15%）</text>
    <path d="M28 78 H652" fill="none" stroke="#26314A" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="88" width="632" height="130" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="108" fill="#5C6A85" font-size="9">①</text>
    <text x="58" y="108" fill="#F0F4FC" font-size="10.5" font-weight="500">EEZ 工程 .eez-project（唯一真源）</text>
    <text x="644" y="108" fill="#5C6A85" font-size="8.5" text-anchor="end">≈85% 的实现量</text>
    <rect x="36" y="112" width="146" height="88" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <text x="46" y="130" fill="#F0F4FC" font-size="9.5" font-weight="500">页面 / 组件</text>
    <text x="46" y="148" fill="#8A99B3" font-size="8.5">scr_host 宿主页</text>
    <text x="46" y="163" fill="#8A99B3" font-size="8.5">wifi_panel 组件</text>
    <text x="46" y="178" fill="#8A99B3" font-size="8.5">scr_pwd 连接页</text>
    <rect x="194" y="112" width="146" height="88" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <text x="204" y="130" fill="#F0F4FC" font-size="9.5" font-weight="500">数据模型（Flow，仅标量）</text>
    <text x="204" y="148" fill="#8A99B3" font-size="8.5">scan_state 扫描态</text>
    <text x="204" y="163" fill="#8A99B3" font-size="8.5">ap_gen 内容代数</text>
    <text x="204" y="178" fill="#8A99B3" font-size="8.5">scan_status 文案</text>
    <rect x="352" y="112" width="146" height="88" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <text x="362" y="130" fill="#F0F4FC" font-size="9.5" font-weight="500">逻辑（表达式）</text>
    <text x="362" y="148" fill="#8A99B3" font-size="8.5">空态 / 状态判据</text>
    <text x="362" y="163" fill="#8A99B3" font-size="8.5">显隐（连接中…）</text>
    <text x="362" y="178" fill="#8A99B3" font-size="8.5">点击·长按→动作</text>
    <rect x="510" y="112" width="146" height="88" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="520" y="130" fill="#F0F4FC" font-size="9.5" font-weight="500">样式 / 字体</text>
    <text x="520" y="148" fill="#8A99B3" font-size="8.5">主题令牌</text>
    <text x="520" y="163" fill="#8A99B3" font-size="8.5">cn14 · GB2312</text>
    <text x="520" y="178" fill="#8A99B3" font-size="8.5">状态胶囊</text>
    <text x="36" y="210" fill="#5C6A85" font-size="8.5">改布局、改文案、改判据 → GUI 里直接改；不写一行 C</text>
    <path d="M340 218 V230" fill="none" stroke="#9DB8FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M335.5 225 l4.5 7 4.5 -7" fill="none" stroke="#9DB8FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="354" y="230" fill="#9DB8FF" font-size="8.5">cli_build</text>
    <rect x="24" y="236" width="632" height="112" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="256" fill="#5C6A85" font-size="9">②</text>
    <text x="58" y="256" fill="#F0F4FC" font-size="10.5" font-weight="500">生成源码 src/ui/（EEZ 产出，勿手改）</text>
    <text x="644" y="256" fill="#5C6A85" font-size="8.5" text-anchor="end">占生成量 ~65%</text>
    <rect x="36" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="45" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">screens.c</text>
    <text x="45" y="301" fill="#8A99B3" font-size="8.2">控件树</text>
    <text x="45" y="315" fill="#5C6A85" font-size="8.2">绑定表达式内联</text>
    <rect x="159.2" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="168.2" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">structs.h</text>
    <text x="168.2" y="301" fill="#8A99B3" font-size="8.2">空壳（无 Struct）</text>
    <text x="168.2" y="315" fill="#5C6A85" font-size="8.2">数组已移出 EEZ</text>
    <rect x="282.4" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="291.4" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">vars.h</text>
    <text x="291.4" y="301" fill="#8A99B3" font-size="8.2">标量枚举</text>
    <text x="291.4" y="315" fill="#5C6A85" font-size="8.2">get / set 访问器</text>
    <rect x="405.6" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="414.6" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">actions.c</text>
    <text x="414.6" y="301" fill="#8A99B3" font-size="8.2">事件入口</text>
    <text x="414.6" y="315" fill="#5C6A85" font-size="8.2">→ Flow 动作</text>
    <rect x="528.8" y="266" width="115.2" height="62" fill="#101A28" rx="7" stroke="#2A3550" stroke-width="0.6"/>
    <text x="537.8" y="283" fill="#9DB8FF" font-size="9.5" font-weight="500">assets</text>
    <text x="537.8" y="301" fill="#8A99B3" font-size="8.2">资源包</text>
    <text x="537.8" y="315" fill="#5C6A85" font-size="8.2">eez_flow_init</text>
    <text x="36" y="342" fill="#5C6A85" font-size="8.5">★ 红线：src/ui/ 由 EEZ 覆盖生成；所有改动手工只发生在 native/ 与 build_example.py</text>
    <rect x="24" y="360" width="632" height="140" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="380" fill="#5C6A85" font-size="9">③</text>
    <text x="58" y="380" fill="#F0F4FC" font-size="10.5" font-weight="500">Flow 运行时（eez-flow · C++ 值语义容器）</text>
    <text x="644" y="380" fill="#5C6A85" font-size="8.5" text-anchor="end">链接 eez/flow</text>
    <rect x="36" y="392" width="196" height="62" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <text x="46" y="410" fill="#3DDC97" font-size="9.5" font-weight="500">Value / ArrayValue</text>
    <text x="46" y="428" fill="#8A99B3" font-size="8.5">std::vector&lt;Value&gt;</text>
    <text x="46" y="443" fill="#8A99B3" font-size="8.5">可变长 · 堆分配</text>
    <rect x="242" y="392" width="196" height="62" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <text x="252" y="410" fill="#3DDC97" font-size="9.5" font-weight="500">表达式求值容器</text>
    <text x="252" y="428" fill="#8A99B3" font-size="8.5">标量状态在此流转</text>
    <text x="252" y="443" fill="#8A99B3" font-size="8.5">本工程未用 Struct 数组</text>
    <rect x="448" y="392" width="196" height="62" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <text x="458" y="410" fill="#3DDC97" font-size="9.5" font-weight="500">eez_flow_init / tick</text>
    <text x="458" y="428" fill="#8A99B3" font-size="8.5">assets 驱动 UI</text>
    <text x="458" y="443" fill="#8A99B3" font-size="8.5">每帧求值表达式</text>
    <text x="36" y="472" fill="#5C6A85" font-size="8.5">设备侧是 C++ 容器；但本工程列表数据不放 Flow——native 直接读 io 静态数组</text>
    <text x="36" y="489" fill="#9DB8FF" font-size="8.5">→ 数据只存在一份：io 静态数组是唯一真值源；EEZ 只持标量状态、native 直读全量列表</text>
    <rect x="24" y="512" width="632" height="152" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="532" fill="#5C6A85" font-size="9">④</text>
    <text x="58" y="532" fill="#F0F4FC" font-size="10.5" font-weight="500">native 层（唯一碰硬件）</text>
    <text x="644" y="532" fill="#5C6A85" font-size="8.5" text-anchor="end">≈15% · 4 个文件</text>
    <rect x="36" y="544" width="196" height="62" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="46" y="562" fill="#F0F4FC" font-size="9.5" font-weight="500">io_iface.h</text>
    <text x="46" y="580" fill="#8A99B3" font-size="8.5">契约面：wifi_ap_t[] + 命令</text>
    <text x="46" y="595" fill="#8A99B3" font-size="8.5">纯头文件，零实现</text>
    <rect x="242" y="544" width="196" height="62" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <text x="252" y="562" fill="#F0F4FC" font-size="9.5" font-weight="500">wifi_ui_sync.cpp</text>
    <text x="252" y="580" fill="#8A99B3" font-size="8.5">native 直读 wifi_ap_at</text>
    <text x="252" y="595" fill="#8A99B3" font-size="8.5">★ 唯一画列表处</text>
    <rect x="448" y="544" width="196" height="62" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="458" y="562" fill="#F0F4FC" font-size="9.5" font-weight="500">io_esp / io_win / io_pc</text>
    <text x="458" y="580" fill="#8A99B3" font-size="8.5">扫描·连接·忘记·存密码</text>
    <text x="458" y="595" fill="#8A99B3" font-size="8.5">同签名，换文件即换后端</text>
    <rect x="36" y="614" width="608" height="26" fill="#16203A" rx="6" stroke="#26314A" stroke-width="0.5"/>
    <text x="48" y="631" fill="#8A99B3" font-size="8.8">硬件：esp_wifi + NVS（真机） · Windows WLAN API（PC 真机） · 假数据（仿真）</text>
    <text x="36" y="656" fill="#5C6A85" font-size="8.5">native 取 io 数组画列表 + 回写标量状态；布局/文案/判据（标量）仍在 EEZ 表达式</text>
    <rect x="24" y="678" width="632" height="152" fill="#0D1420" rx="10" stroke="#26314A" stroke-width="0.6"/>
    <text x="36" y="698" fill="#5C6A85" font-size="9">⑤</text>
    <text x="58" y="698" fill="#F0F4FC" font-size="10.5" font-weight="500">三条设计目标怎么保证</text>
    <rect x="36" y="708" width="196" height="110" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="46" y="728" fill="#9DB8FF" font-size="9.5" font-weight="500">信息全面性</text>
    <text x="46" y="750" fill="#8A99B3" font-size="8.5">io 7 字段全量上报</text>
    <text x="46" y="767" fill="#8A99B3" font-size="8.5">信号/加密/频段/锁/保存/连接</text>
    <text x="46" y="784" fill="#8A99B3" font-size="8.5">空列表判据 = wifi_ap_count == 0</text>
    <rect x="242" y="708" width="196" height="110" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="252" y="728" fill="#3DDC97" font-size="9.5" font-weight="500">功能稳定性</text>
    <text x="252" y="750" fill="#8A99B3" font-size="8.5">单一真值源 = io 静态数组</text>
    <text x="252" y="767" fill="#8A99B3" font-size="8.5">三后端只换一个文件</text>
    <text x="252" y="784" fill="#8A99B3" font-size="8.5">先填数组再置 scan_state=2</text>
    <rect x="448" y="708" width="196" height="110" fill="#101A28" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="458" y="728" fill="#F0D48F" font-size="9.5" font-weight="500">封装高级性</text>
    <text x="458" y="750" fill="#8A99B3" font-size="8.5">标量走 EEZ 表达式</text>
    <text x="458" y="767" fill="#8A99B3" font-size="8.5">列表行 native 自绘（EEZ List wip）</text>
    <text x="458" y="784" fill="#8A99B3" font-size="8.5">原生控件 + 表达式，零自创</text>
    <text x="28" y="850" fill="#5C6A85" font-size="8.5">实现量分布</text>
    <rect x="28" y="858" width="530" height="16" fill="#5B8CFF" rx="4"/>
    <rect x="558" y="858" width="94" height="16" fill="#E06A6A" rx="4"/>
    <text x="293" y="870" fill="#0B0F1A" font-size="8.8" font-weight="500" text-anchor="middle">EEZ 界面 + 标量状态 85%</text>
    <text x="605" y="870" fill="#0B0F1A" font-size="8.2" font-weight="500" text-anchor="middle">native 15%</text>
</svg>
