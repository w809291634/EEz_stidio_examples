<svg viewBox="0 0 680 556" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <title>框图 · 密码下行 / 结果上行</title>
  <desc>下行 5 步（输入→action→直传→校验→join）+ 上行 5 步（事件→结果→pump→Flow→UI）+ reason 映射</desc>
  <rect x="0" y="0" width="680" height="556" rx="14" fill="#0B0F1A" stroke="#26314A" stroke-width="1"/>
    <text x="28" y="38" fill="#F0F4FC" font-size="20" font-weight="500">密码怎么下去、结果怎么上来</text>
    <text x="28" y="64" fill="#8A99B3" font-size="12.5">密码只在「输入框 → 一次调用」之间存在；结果只通过变量回来</text>
    <path d="M28 78 H652" fill="none" stroke="#26314A" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="100" fill="#5C6A85" font-size="9.5">① 下行：密码 → WiFi 驱动（同一拍内完成，不阻塞 UI）</text>
    <rect x="30" y="112" width="116" height="74" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <rect x="39" y="121" width="15" height="15" fill="#5B8CFF" rx="7.5" opacity="0.16"/>
    <text x="46.5" y="132" fill="#5B8CFF" font-size="8" font-weight="500" text-anchor="middle">1</text>
    <text x="39" y="152" fill="#F0F4FC" font-size="8.8" font-weight="500">ta_pwd 输入</text>
    <text x="39" y="168" fill="#8A99B3" font-size="7.8">密码模式 · 最多 63</text>
    <text x="39" y="180" fill="#5C6A85" font-size="7.8">点框才弹键盘</text>
    <path d="M147 149 h6" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M153 145 l4 3.2 l-4 3.2" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="156" y="112" width="116" height="74" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <rect x="165" y="121" width="15" height="15" fill="#5B8CFF" rx="7.5" opacity="0.16"/>
    <text x="172.5" y="132" fill="#5B8CFF" font-size="8" font-weight="500" text-anchor="middle">2</text>
    <text x="165" y="152" fill="#F0F4FC" font-size="8.8" font-weight="500">点「连接」</text>
    <text x="165" y="168" fill="#8A99B3" font-size="7.8">action_connect()</text>
    <text x="165" y="180" fill="#5C6A85" font-size="7.8">生成事件→你的函数</text>
    <path d="M273 149 h6" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M279 145 l4 3.2 l-4 3.2" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="282" y="112" width="116" height="74" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <rect x="291" y="121" width="15" height="15" fill="#3DDC97" rx="7.5" opacity="0.16"/>
    <text x="298.5" y="132" fill="#3DDC97" font-size="8" font-weight="500" text-anchor="middle">3</text>
    <text x="291" y="152" fill="#F0F4FC" font-size="8.8" font-weight="500">命令槽单份拷贝</text>
    <text x="291" y="168" fill="#8A99B3" font-size="7.8">≤64B，只存一份</text>
    <text x="291" y="180" fill="#5C6A85" font-size="7.8">排空后立即清零</text>
    <path d="M399 149 h6" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M405 145 l4 3.2 l-4 3.2" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="408" y="112" width="116" height="74" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <rect x="417" y="121" width="15" height="15" fill="#3DDC97" rx="7.5" opacity="0.16"/>
    <text x="424.5" y="132" fill="#3DDC97" font-size="8" font-weight="500" text-anchor="middle">4</text>
    <text x="417" y="152" fill="#F0F4FC" font-size="8.8" font-weight="500">本地校验</text>
    <text x="417" y="168" fill="#8A99B3" font-size="7.8">长度 8–63</text>
    <text x="417" y="180" fill="#5C6A85" font-size="7.8">不合规→reason=5</text>
    <path d="M525 149 h6" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M531 145 l4 3.2 l-4 3.2" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="534" y="112" width="116" height="74" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <rect x="543" y="121" width="15" height="15" fill="#3DDC97" rx="7.5" opacity="0.16"/>
    <text x="550.5" y="132" fill="#3DDC97" font-size="8" font-weight="500" text-anchor="middle">5</text>
    <text x="543" y="152" fill="#F0F4FC" font-size="8.8" font-weight="500">io_wifi_join()</text>
    <text x="543" y="168" fill="#8A99B3" font-size="7.8">set_config + connect</text>
    <text x="543" y="180" fill="#5C6A85" font-size="7.8">异步，立即返回</text>
    <text x="30" y="204" fill="#9DB8FF" font-size="8.5">★ 密码不写进 Flow 变量、不进日志、不落 NVS；只在命令槽里存在到同拍 drain 完成（≤1 帧）</text>
    <text x="30" y="232" fill="#5C6A85" font-size="9.5">② 上行：结果 → UI（全部在 UI 任务里发布，驱动任务只写标志）</text>
    <rect x="30" y="244" width="116" height="74" fill="#101A28" rx="8" stroke="#E8A25C" stroke-width="0.6"/>
    <rect x="39" y="253" width="15" height="15" fill="#E8A25C" rx="7.5" opacity="0.16"/>
    <text x="46.5" y="264" fill="#E8A25C" font-size="8" font-weight="500" text-anchor="middle">1</text>
    <text x="39" y="284" fill="#F0F4FC" font-size="8.8" font-weight="500">CONNECTED</text>
    <text x="39" y="300" fill="#8A99B3" font-size="7.8">DISCONNECTED(reason)</text>
    <text x="39" y="312" fill="#5C6A85" font-size="7.8">驱动任务只写标志</text>
    <path d="M147 281 h6" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M153 277 l4 3.2 l-4 3.2" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="156" y="244" width="116" height="74" fill="#101A28" rx="8" stroke="#E8A25C" stroke-width="0.6"/>
    <rect x="165" y="253" width="15" height="15" fill="#E8A25C" rx="7.5" opacity="0.16"/>
    <text x="172.5" y="264" fill="#E8A25C" font-size="8" font-weight="500" text-anchor="middle">2</text>
    <text x="165" y="284" fill="#F0F4FC" font-size="8.8" font-weight="500">结果结构 g_res</text>
    <text x="165" y="300" fill="#8A99B3" font-size="7.8">{state, reason, ip}</text>
    <text x="165" y="312" fill="#5C6A85" font-size="7.8">单写者，不加锁</text>
    <path d="M273 281 h6" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M279 277 l4 3.2 l-4 3.2" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="282" y="244" width="116" height="74" fill="#101A28" rx="8" stroke="#3DDC97" stroke-width="0.6"/>
    <rect x="291" y="253" width="15" height="15" fill="#3DDC97" rx="7.5" opacity="0.16"/>
    <text x="298.5" y="264" fill="#3DDC97" font-size="8" font-weight="500" text-anchor="middle">3</text>
    <text x="291" y="284" fill="#F0F4FC" font-size="8.8" font-weight="500">pump 读结果</text>
    <text x="291" y="300" fill="#8A99B3" font-size="7.8">UI 任务发布变量</text>
    <text x="291" y="312" fill="#5C6A85" font-size="7.8">成功才清空输入</text>
    <path d="M399 281 h6" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M405 277 l4 3.2 l-4 3.2" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="408" y="244" width="116" height="74" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <rect x="417" y="253" width="15" height="15" fill="#5B8CFF" rx="7.5" opacity="0.16"/>
    <text x="424.5" y="264" fill="#5B8CFF" font-size="8" font-weight="500" text-anchor="middle">4</text>
    <text x="417" y="284" fill="#F0F4FC" font-size="8.8" font-weight="500">eez_flow_tick</text>
    <text x="417" y="300" fill="#8A99B3" font-size="7.8">按钮「连接中…」</text>
    <text x="417" y="312" fill="#5C6A85" font-size="7.8">收起 / 标题红字</text>
    <path d="M525 281 h6" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M531 277 l4 3.2 l-4 3.2" fill="none" stroke="#33405E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="534" y="244" width="116" height="74" fill="#101A28" rx="8" stroke="#5B8CFF" stroke-width="0.6"/>
    <rect x="543" y="253" width="15" height="15" fill="#5B8CFF" rx="7.5" opacity="0.16"/>
    <text x="550.5" y="264" fill="#5B8CFF" font-size="8" font-weight="500" text-anchor="middle">5</text>
    <text x="543" y="284" fill="#F0F4FC" font-size="8.8" font-weight="500">LVGL 呈现</text>
    <text x="543" y="300" fill="#8A99B3" font-size="7.8">失败保留半页+键盘</text>
    <text x="543" y="312" fill="#5C6A85" font-size="7.8">可直接重试</text>
    <text x="30" y="336" fill="#9DB8FF" font-size="8.5">★ 成功 → 半页自动收起、该行变「已连接」；失败 → 半页不关、按钮恢复可点，密码框保留供重试</text>
    <rect x="28" y="352" width="624" height="136" fill="#0D1420" rx="8" stroke="#26314A" stroke-width="0.6"/>
    <text x="40" y="372" fill="#5C6A85" font-size="9.5">③ 结果不是一个「失败」，而是可解释的 reason（否则用户只会看到「没用」）</text>
    <text x="40" y="394" fill="#5C6A85" font-size="8">reason</text>
    <text x="120" y="394" fill="#5C6A85" font-size="8">含义</text>
    <text x="300" y="394" fill="#5C6A85" font-size="8">UI 文案</text>
    <text x="470" y="394" fill="#5C6A85" font-size="8">动作</text>
    <text x="40" y="414" fill="#E06A6A" font-size="8.2">15</text>
    <text x="120" y="414" fill="#F0F4FC" font-size="8.2">四次握手超时（密码不对）</text>
    <text x="300" y="414" fill="#8A99B3" font-size="8.2">密码错误，请重新输入</text>
    <text x="470" y="414" fill="#8A99B3" font-size="8.2">保留半页，输入框聚焦</text>
    <text x="40" y="431" fill="#E06A6A" font-size="8.2">201</text>
    <text x="120" y="431" fill="#F0F4FC" font-size="8.2">扫描不到该 AP</text>
    <text x="300" y="431" fill="#8A99B3" font-size="8.2">网络已消失，请重新扫描</text>
    <text x="470" y="431" fill="#8A99B3" font-size="8.2">回列表并触发扫描</text>
    <text x="40" y="448" fill="#E06A6A" font-size="8.2">205 / 2 / 3</text>
    <text x="120" y="448" fill="#F0F4FC" font-size="8.2">连接失败 / 认证过期</text>
    <text x="300" y="448" fill="#8A99B3" font-size="8.2">连接超时，可重试</text>
    <text x="470" y="448" fill="#8A99B3" font-size="8.2">按钮恢复，允许重试</text>
    <text x="40" y="465" fill="#E06A6A" font-size="8.2">本地 5</text>
    <text x="120" y="465" fill="#F0F4FC" font-size="8.2">长度不在 8–63</text>
    <text x="300" y="465" fill="#8A99B3" font-size="8.2">密码需 8–63 位</text>
    <text x="470" y="465" fill="#8A99B3" font-size="8.2">不发命令，就地提示</text>
    <text x="28" y="512" fill="#8A99B3" font-size="8.5">四条纪律：① 密码只在 ta_pwd 与一次调用的栈上 ② 日志只打长度 ③ 失败路径也要清零临时缓冲 ④ 只有 remember=1 才落盘</text>
    <text x="28" y="532" fill="#5C6A85" font-size="8.5">平台差异：PC（Windows）temporary profile 不稳，remember=0 也需先建 profile；真机（esp_wifi）可直接不落 NVS</text>
</svg>
